<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hub — Chat Workspace</title>
<link rel="stylesheet" href="../css/chat.css">
</head>
<body>

<div class="app">

  <!-- ============ LEFT: CONVERSATION HISTORY SIDEBAR ============ -->
  <aside class="history-panel">
    <div class="history-panel__top">
      <div class="brand">
        <span class="brand__mark">AI</span>
        <span class="brand__name">Hub</span>
      </div>
      <button class="btn-new-chat" id="newChatBtn" title="Start a new conversation">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        New chat
      </button>
    </div>

    <div class="history-search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input type="text" id="historySearch" placeholder="Search conversations">
    </div>

    <div class="history-list" id="historyList">
      <!-- populated by chat.js -->
    </div>

    <div class="history-panel__bottom">
      <a href="./dashboard.html" class="back-to-dashboard">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to dashboard
      </a>
    </div>
  </aside>

  <!-- ============ MAIN: CHAT WORKSPACE ============ -->
  <main class="workspace">

    <!-- top bar: mode switch + model selector -->
    <header class="workspace__header">
      <div class="mode-switch" role="tablist" aria-label="Chat mode">
        <button class="mode-switch__btn is-active" data-mode="single" role="tab" aria-selected="true">Single AI</button>
        <button class="mode-switch__btn" data-mode="multi" role="tab" aria-selected="false">Compare models</button>
      </div>

      <div class="model-selector" id="modelSelector">
        <!-- populated by chat.js: single = dropdown, multi = checkboxes -->
      </div>
    </header>

    <!-- SINGLE AI CHAT WINDOW -->
    <section class="chat-window" id="singleChatWindow">
      <div class="chat-window__scroll" id="singleMessages"></div>
    </section>

    <!-- MULTI AI COMPARISON PANELS -->
    <section class="compare-window" id="compareWindow" hidden>
      <div class="compare-window__grid" id="comparePanels"></div>
    </section>

    <!-- composer -->
    <footer class="composer">
      <div class="composer__inner">
        <textarea id="promptInput" placeholder="Ask anything… (Shift+Enter for a new line)" rows="1"></textarea>
        <button class="composer__send" id="sendBtn" title="Send">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M17 3L3 9.5l6 2.2L11.3 18 17 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="composer__hint" id="composerHint"></p>
    </footer>

  </main>
</div>

<script src="../js/chat.js"></script>
</body>
</html>
